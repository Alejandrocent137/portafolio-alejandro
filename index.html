<!DOCTYPE html>
<html lang="es">
<head>
    <!-- 1. Codificación de caracteres universal (Soporta ñ y tildes) -->
    <meta charset="UTF-8">

    <!-- 2. Control de escala y dimensiones en dispositivos móviles (Responsive) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 3. Metadatos de Autoría y Descripción SEO -->
    <meta name="author" content="Alejandro Bedoya">
    <meta name="description" content="Portafolio profesional de diseño web y desarrollo de interfaces digitales.">

    <!-- 4. Título visible en la pestaña del navegador y motores de búsqueda -->
    <title>Portafolio Profesional | Alejandro Bedoya</title>

    <!-- 5. Favicon (icono representativo de la pestaña) -->
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
    <h1>Bienvenido a mi Portafolio Web</h1>
    <p>Página construida con estándares modernos de HTML5.</p>
</body>
</html>
